name: Python checks

on:
  push:
    branches: ["main", "v2/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU-test dependencies
        run: python -m pip install --upgrade pip pytest numpy matplotlib

      - name: Compile Python modules
        run: python -m compileall -q main.py benchmark profiling roofline llm_profiler report_gen tests triton

      - name: Check shell script syntax
        run: bash -n scripts/profile_ncu.sh scripts/run_full_benchmark.sh

      - name: Run unit tests
        run: python -m pytest -q
